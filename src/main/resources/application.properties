spring.application.name=sistema-de-vendas
spring.datasource.url=${DB_URL:jdbc:mysql://localhost/medpro_api?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:aluno}

server.port=${PORT:8080}

# Usuários de teste criados na primeira execução (senhas gravadas com BCrypt)
app.usuarios.admin.email=${ADMIN_EMAIL:admin@vendas.com}
app.usuarios.admin.senha=${ADMIN_PASSWORD:admin123}
app.usuarios.padrao.email=${PADRAO_EMAIL:padrao@vendas.com}
app.usuarios.padrao.senha=${PADRAO_PASSWORD:padrao123}

# Tabelas da clínica são criadas pelo Flyway (db/migration); as de vendas ainda pelo Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
