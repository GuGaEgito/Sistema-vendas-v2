services:
  db:
    image: mysql:8.4
    container_name: mysql_medpro
    environment:
      MYSQL_ROOT_PASSWORD: aluno
      MYSQL_DATABASE: medpro_api
    ports:
      # 3307 no host para não conflitar com um MySQL local na 3306
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
